<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>TaskFlow – Performance Dashboard</title>
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
--bg:#0a0f1d;--bg2:#17203a;--card:rgba(255,255,255,.065);--bd:rgba(255,255,255,.13);--tx:#f1f4ff;--mut:#9ba7c9;--o:#f47a20;--g:#8cc63f;--b:#38bdf8;--y:#fbbf24;--sh:rgba(0,0,0,.5)}
@media(prefers-color-scheme:light){:root:not([data-theme="dark"]){--bg:#f3f5fa;--bg2:#e3e8f4;--card:rgba(255,255,255,.82);--bd:rgba(20,30,70,.13);--tx:#14193a;--mut:#5a6486;--sh:rgba(40,60,120,.2)}}
:root[data-theme="light"]{--bg:#f3f5fa;--bg2:#e3e8f4;--card:rgba(255,255,255,.82);--bd:rgba(20,30,70,.13);--tx:#14193a;--mut:#5a6486;--sh:rgba(40,60,120,.2)}
*{box-sizing:border-box}html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;font-family:"Segoe UI",system-ui,-apple-system,Arial,sans-serif;color:var(--tx);background:radial-gradient(900px 500px at 8% -10%,rgba(244,122,32,.18),transparent),radial-gradient(900px 500px at 100% 0,rgba(140,198,63,.15),transparent),linear-gradient(var(--bg2),var(--bg));background-attachment:fixed;min-height:100vh;padding:18px}
.w{max-width:1220px;margin:auto}
header{display:flex;flex-wrap:wrap;gap:14px;justify-content:space-between;align-items:center;margin-bottom:16px}
.br{display:flex;align-items:center;gap:14px}
.hr{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.logo{width:74px;height:74px;border-radius:50%;box-shadow:0 10px 26px var(--sh),0 0 0 3px rgba(255,255,255,.5);animation:fl 4s ease-in-out infinite;background:#fff}
@keyframes fl{50%{transform:translateY(-5px) rotateY(12deg)}}
h1{margin:0;font-size:24px;letter-spacing:.2px}h1 span{background:linear-gradient(90deg,var(--o),var(--g));-webkit-background-clip:text;background-clip:text;color:transparent}
.s{color:var(--mut);font-size:12px}
button,select,input,textarea,a.bt{font:inherit;color:var(--tx);background:var(--card);border:1px solid var(--bd);border-radius:10px;padding:7px 11px}
a.bt{text-decoration:none;display:inline-block}
button,a.bt{cursor:pointer;transition:.2s}button:hover,a.bt:hover{transform:translateY(-1px)}select option{color:#111}
nav{display:flex;gap:6px;overflow-x:auto;padding-bottom:6px;margin-bottom:14px}
nav button{white-space:nowrap}#yb{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px}#yb button.on,nav button.on,.vt button.on{background:linear-gradient(90deg,var(--o),var(--g));color:#fff;border:0;transform:translateY(-2px);box-shadow:0 8px 20px rgba(244,122,32,.4)}
.vt{display:inline-flex;gap:6px;margin-left:8px}.vt button{padding:3px 9px;font-size:12px}
.g{display:grid;gap:14px;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));perspective:1000px;margin-bottom:14px}
.c{background:var(--card);border:1px solid var(--bd);border-radius:18px;padding:16px;backdrop-filter:blur(14px);box-shadow:0 16px 38px var(--sh);transition:transform .15s ease-out;animation:up .6s both;min-width:0;position:relative}
@keyframes up{from{opacity:0;transform:translateY(20px) rotateX(16deg)}to{opacity:1}}
.k{font-size:11px;color:var(--mut);text-transform:uppercase;letter-spacing:.09em}.v{font-size:32px;font-weight:700;margin-top:4px}
.kc::after{content:"";position:absolute;left:16px;right:16px;bottom:0;height:3px;border-radius:3px;background:var(--ac)}
h3{margin:0 0 10px;font-size:15px}
.row{display:flex;flex-wrap:wrap;gap:14px;margin-bottom:14px}.row>.c{flex:1 1 360px}
.sc{overflow-x:auto}table{width:100%;border-collapse:collapse;font-size:12.5px}td,th{padding:6px;text-align:left;border-bottom:1px solid var(--bd);white-space:nowrap}th{color:var(--mut)}
.add{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:10px;align-items:center}
.rings{display:grid;grid-template-columns:repeat(auto-fit,minmax(110px,1fr));gap:10px;text-align:center}
.rings svg{width:100%;max-width:110px}.rings .n{font-size:11.5px;margin-top:2px}
.lg{font-size:11px;color:var(--mut);margin-top:6px}
.stt{border:1px solid;border-radius:20px;padding:2px 9px;font-weight:600;font-size:11.5px}
.od{color:var(--o);font-weight:600;font-size:11px;margin-left:4px}
.note{border-left:3px solid var(--o)}
@media(prefers-reduced-motion:reduce){.c,.logo{animation:none}}
</style></head><body>

const ST_MAP = { completed: "Done", in_progress: "In Progress", pending: "Pending" };

const E = s => String(s == null ? "" : s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;").replace(/'/g,"&#39;");

try { const th = localStorage.getItem("tf_perf_theme"); if (th) document.documentElement.dataset.theme = th; } catch (e) {}

// ── Auth: sirf Admin / Manager ──────────────────────────────
const user = await requireAuth(["admin", "manager"]);
if (!user) throw new Error("Redirecting");
$("#us").textContent = user.name + " · " + user.role;

// ── State ───────────────────────────────────────────────────
let RAW = [], USERS = [], D = { T: [], off: [], fn: [], years: [] };
let yr = new Date().getFullYear(), cur = -1, fo = "All", ff = "All", vw = "o", basis = "created";
let HAS_FN = null, lastSig = "", first = true;
const PAGE = 1000;
const sy = (m, bad) => { const e = $("#sy"); if (e) { e.textContent = m; e.style.color = bad ? "var(--o)" : "var(--mut)"; } };

// ── Data (Supabase tasks table) ─────────────────────────────
const COLS = "id,title,description,status,deadline,created_at,assigned_to(id,name,role),assigned_by(id,name)";
const pageTasks = (withFn, from) => supabase.from("tasks")
  .select(COLS + (withFn ? ",function_name" : ""))
  .order("created_at", { ascending: false }).order("id")
  .range(from, from + PAGE - 1);

async function fetchTasks() {
  let withFn = HAS_FN !== false, rows = [];
  for (let from = 0; ; from += PAGE) {
    const r = await pageTasks(withFn, from);
    if (r.error && withFn && (r.error.code === "42703" || /function_name/i.test(r.error.message || ""))) {
      HAS_FN = false; withFn = false; rows = []; from = -PAGE; continue;   // column abhi DB mein nahi
    }
    if (r.error) throw r.error;
    if (withFn) HAS_FN = true;
    rows = rows.concat(r.data || []);
    if (!r.data || r.data.length < PAGE) break;
  }
  return rows;
}
async function loadData() {
  const [rows, u] = await Promise.all([fetchTasks(), supabase.from("users").select("id,name,role").order("name")]);
  if (u.error) throw u.error;
  return { rows, users: u.data || [] };
}
const sig = (rows, users) =>
  rows.map(r => [r.id, r.status, r.title, r.deadline, r.function_name, r.assigned_to && r.assigned_to.id, r.assigned_to && r.assigned_to.name].join("|")).join("~")
  + "#" + users.map(u => u.id + u.name + u.role).join(",") + "#" + HAS_FN;

function buildD() {
  const T = RAW.map(r => {
    let y, m;
    if (basis === "deadline" && r.deadline) { const p = r.deadline.split("-").map(Number); y = p[0]; m = p[1] - 1; }
    else { const d = new Date(r.created_at); y = d.getFullYear(); m = d.getMonth(); }
    const a = r.assigned_to;
    return { id: r.id, y, m, k: a ? a.id : "_none", o: a ? a.name : "Unassigned",
      f: ((HAS_FN && r.function_name) || "").trim() || "General",
      t: r.title || "", desc: r.description || "", dl: r.deadline || null,
      s: ST_MAP[r.status] || "Pending" };
  });
  // Officers = employees + koi bhi jisko task assign hai
  const om = new Map();
  USERS.filter(u => u.role === "employee").forEach(u => om.set(u.id, u.name));
  T.forEach(t => { if (!om.has(t.k)) om.set(t.k, t.o); });
  const cnt = {}; let off = [...om].map(([k, label]) => ({ k, label })).sort((a, b) => a.label.localeCompare(b.label));
  off.forEach(o => { cnt[o.label] = (cnt[o.label] || 0) + 1; if (cnt[o.label] > 1) o.label += " (" + cnt[o.label] + ")"; });
  const fn = [...new Set(T.map(t => t.f))].sort();
  const now = new Date().getFullYear();
  const years = [...new Set([...T.map(t => t.y), now])].sort();
  D = { T, off, fn, years };
  if (!years.includes(yr)) yr = years.includes(now) ? now : years[years.length - 1];
  if (fo !== "All" && !off.some(o => o.k == fo)) fo = "All";
  if (ff !== "All" && !fn.includes(ff)) ff = "All";
}

// ── Helpers ─────────────────────────────────────────────────
function st(l) { const n = l.length, d = l.filter(t => t.s == "Done").length, p = l.filter(t => t.s == "In Progress").length; return { n, d, p, w: n - d - p, pc: n ? Math.round(d * 100 / n) : 0 }; }
const Y = () => D.T.filter(t => t.y == yr);
const sel = () => Y().filter(t => cur < 0 || t.m == cur);
const cmp = (a, b) => (b.n > 0) - (a.n > 0) || b.pc - a.pc || b.d - a.d;
const fmtD = s => { if (!s) return "—"; const [y, m, d] = s.split("-").map(Number); return d + " " + MN[m - 1] + " " + y; };
const todayStr = () => { const d = new Date(); return d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0") + "-" + String(d.getDate()).padStart(2, "0"); };

function yearBar() {
  $("#yb").innerHTML = D.years.map(y => { const s = st(D.T.filter(t => t.y == y)); return `<button data-y="${y}" class="${y == yr ? "on" : ""}">${y}${s.n ? " · " + s.pc + "%" : ""}</button>`; }).join("");
  document.querySelectorAll("[data-y]").forEach(b => b.onclick = () => { yr = +b.dataset.y; render(); });
}
function nav() {
  $("#nav").innerHTML = [["-1", "Full Year"], ...MN.map((n, i) => [i, n])].map(([i, n]) => `<button data-i="${i}" class="${i == cur ? "on" : ""}">${n}</button>`).join("");
  document.querySelectorAll("#nav button").forEach(b => b.onclick = () => { cur = +b.dataset.i; nav(); render(); });
}
function ring(p, c, sz = 110) {
  const r = 42, C = 2 * Math.PI * r, glow = c.startsWith("url") ? "#f47a20" : c;
  return `<svg viewBox="0 0 110 110" width="${sz}"><circle cx="55" cy="55" r="${r}" fill="none" stroke="var(--bd)" stroke-width="10"/><circle cx="55" cy="55" r="${r}" fill="none" stroke="${c}" stroke-width="10" stroke-linecap="round" stroke-dasharray="${C}" stroke-dashoffset="${C}" transform="rotate(-90 55 55)" style="filter:drop-shadow(0 0 5px ${glow})"><animate attributeName="stroke-dashoffset" to="${C * (1 - p / 100)}" dur="1.3s" fill="freeze" calcMode="spline" keySplines=".2 .8 .2 1" keyTimes="0;1"/></circle><text x="55" y="61" text-anchor="middle" font-size="19" font-weight="700" fill="var(--tx)">${p}%</text></svg>`;
}

// ── Render ──────────────────────────────────────────────────
function render() {
  yearBar();
  const L = sel(), A = st(L), ml = cur < 0 ? "Full Year " + yr : MN[cur] + " " + yr;
  $("#ttl").innerHTML = E(TITLE).replace(/(\S+)$/, "<span>$1</span>");
  $("#sub").textContent = SUB.replace(" · TaskFlow live data", "") + " · " + yr;
  const kp = (l, v, ac) => `<div class="c kc" style="--ac:${ac}"><div class="k">${l}</div><div class="v" data-c="${v}">0</div></div>`;
  let h = "";
  if (!D.T.length) h += `<div class="c note" style="margin-bottom:14px">TaskFlow mein abhi koi task nahi hai. <a href="tasks.html" style="color:var(--o)">Tasks page</a> par task create karein — yahan automatically show ho jayega.</div>`;
  h += `<div class="g">${kp("Total Tasks · " + ml, A.n, "var(--o)")}${kp("Completed", A.d, "var(--g)")}${kp("In Progress", A.p, "var(--b)")}${kp("Pending", A.w, "var(--y)")}</div>`;

  const rkO = D.off.map(o => ({ o: o.label, ...st(L.filter(t => t.k == o.k)) })).sort(cmp);
  const rk = vw === "o" ? rkO : D.fn.map(f => ({ o: f, ...st(L.filter(t => t.f == f)) })).filter(r => r.n > 0).sort(cmp);
  const KL = vw === "o" ? "officer" : "function";

  h += `<div class="row"><div class="c"><h3>Department Score · ${ml} <span class="s">(Officer-wise)</span></h3><div style="text-align:center">${ring(A.pc, "url(#gr)", 170)}<svg width="0" height="0"><defs><linearGradient id="gr"><stop offset="0" stop-color="#f47a20"/><stop offset="1" stop-color="#8cc63f"/></linearGradient></defs></svg></div>
<div class="rings" style="margin-top:12px">${rkO.map(r => `<div>${ring(r.pc, r.pc >= 75 ? "var(--g)" : r.pc >= 50 ? "var(--y)" : "var(--o)", 90)}<div class="n">${E(r.o)}<br><span class="s">${r.d}/${r.n} done</span></div></div>`).join("") || '<div class="s">Koi officer nahi.</div>'}</div></div>`;

  const n = Math.max(rk.length, 1), cx = 200;
  const pl = rk.map((r, i) => { const rad = 70 + i * (115 / n), ang = (i * 137) % 360, c = r.pc >= 75 ? "#8cc63f" : r.pc >= 50 ? "#fbbf24" : "#f47a20", sz = 6 + r.pc / 11;
    return `<circle cx="${cx}" cy="${cx}" r="${rad}" fill="none" stroke="var(--bd)" stroke-dasharray="3 6"/><g><animateTransform attributeName="transform" type="rotate" from="${ang} ${cx} ${cx}" to="${ang + 360} ${cx} ${cx}" dur="${26 + i * 9}s" repeatCount="indefinite"/><circle cx="${cx + rad}" cy="${cx}" r="${sz}" fill="${c}" style="filter:drop-shadow(0 0 8px ${c})"/></g>`; }).join("");
  const vt = HAS_FN ? `<span class="vt"><button data-vw="o" class="${vw == "o" ? "on" : ""}">Officer</button><button data-vw="f" class="${vw == "f" ? "on" : ""}">Function</button></span>` : "";
  h += `<div class="c"><h3>Performance Galaxy · ${ml} <span class="s">(${KL}-wise)</span>${vt}</h3><svg viewBox="0 0 400 400" width="100%" style="max-width:380px;display:block;margin:auto"><defs><radialGradient id="co"><stop offset="0" stop-color="#ffb066"/><stop offset=".6" stop-color="#f47a20"/><stop offset="1" stop-color="#8cc63f"/></radialGradient></defs>${pl}<circle cx="${cx}" cy="${cx}" r="46" fill="url(#co)" style="filter:drop-shadow(0 0 18px #f47a20)"><animate attributeName="r" values="44;48;44" dur="3s" repeatCount="indefinite"/></circle><text x="${cx}" y="${cx + 8}" text-anchor="middle" font-size="24" font-weight="700" fill="#fff">${A.pc}%</text></svg>
<div class="lg" style="text-align:center">Center = poora department · Har sitara = ek ${KL} · Bara sitara = behtar performance, andar wali orbit = top rank</div>
<div class="lg" style="text-align:center">${rk.map((r, i) => `${i + 1}. ${E(r.o)} <b>${r.n ? r.pc + "%" : "–"}</b>`).join(" &nbsp;·&nbsp; ")}</div></div></div>`;

  h += `<div class="c" style="margin-bottom:14px"><h3>Month-wise Score</h3><div style="display:flex;flex-wrap:wrap;gap:14px;justify-content:center">${MN.map((nm, m) => { const s = st(Y().filter(t => t.m == m)), p = s.n ? s.pc : 0; return `<div data-mb="${m}" style="cursor:pointer;text-align:center;opacity:${cur < 0 || cur == m ? 1 : .5}"><div style="width:62px;height:62px;border-radius:50%;background:conic-gradient(#f47a20,#8cc63f ${p}%,var(--bd) 0);display:grid;place-items:center;box-shadow:0 8px 20px var(--sh)"><div style="width:46px;height:46px;border-radius:50%;background:var(--bg2);display:grid;place-items:center;font-weight:700;font-size:13px">${s.n ? p + "%" : "–"}</div></div><div class="s" style="margin-top:4px">${nm}</div></div>`; }).join("")}</div></div>`;

  const lg = L.filter(t => (fo == "All" || t.k == fo) && (ff == "All" || t.f == ff));
  const today = todayStr();
  const oo = D.off.map(o => `<option value="${E(o.k)}" ${o.k == fo ? "selected" : ""}>${E(o.label)}</option>`).join("");
  const fOpt = D.fn.map(f => `<option value="${E(f)}" ${f == ff ? "selected" : ""}>${E(f)}</option>`).join("");
  const cols = HAS_FN ? 6 : 5;
  h += `<div class="c"><h3>Task Log · ${ml} <span class="s">(TaskFlow tasks — status/edit ke liye <a href="tasks.html" style="color:var(--o)">Tasks page</a>)</span></h3>
<div class="add"><span class="s">Filter:</span><select id="fo"><option value="All">All officers</option>${oo}</select>${HAS_FN ? `<select id="ff"><option value="All">All functions</option>${fOpt}</select>` : ""}</div>
<div class="sc"><table><tr><th>Month</th><th>Officer</th>${HAS_FN ? "<th>HR Function</th>" : ""}<th style="min-width:240px">Task</th><th>Deadline</th><th>Status</th></tr>${lg.map(t => {
    const od = t.dl && t.s !== "Done" && t.dl < today ? '<span class="od">⚠ Overdue</span>' : "";
    const ds = t.desc ? `<div class="s" style="margin-top:2px">${E(t.desc.length > 140 ? t.desc.slice(0, 140) + "…" : t.desc)}</div>` : "";
    return `<tr><td>${MN[t.m]} ${t.y}</td><td>${E(t.o)}</td>${HAS_FN ? `<td>${E(t.f)}</td>` : ""}<td style="white-space:normal;min-width:240px">${E(t.t)}${ds}</td><td>${fmtD(t.dl)}${od}</td><td><span class="stt" style="color:${SC[t.s]};border-color:${SC[t.s]}">${t.s}</span></td></tr>`; }).join("") || `<tr><td colspan="${cols}">Is selection mein koi task nahi.</td></tr>`}</table></div></div>`;

  $("#m").innerHTML = h;
  document.querySelectorAll("[data-c]").forEach(e => { const t = +e.dataset.c, s = performance.now(); (function f(nw) { const k = Math.min(1, (nw - s) / 1000); e.textContent = Math.round(t * (1 - Math.pow(1 - k, 3))); if (k < 1) requestAnimationFrame(f); })(s); });
  document.querySelectorAll(".g .c").forEach((c, i) => { c.style.animationDelay = i * 70 + "ms"; c.onmousemove = e => { const r = c.getBoundingClientRect(), x = (e.clientX - r.left) / r.width - .5, y = (e.clientY - r.top) / r.height - .5; c.style.transform = `rotateY(${x * 12}deg) rotateX(${-y * 12}deg) translateZ(8px)`; }; c.onmouseleave = () => c.style.transform = ""; });
  document.querySelectorAll("[data-mb]").forEach(e => e.onclick = () => { cur = cur == +e.dataset.mb ? -1 : +e.dataset.mb; nav(); render(); });
  document.querySelectorAll("[data-vw]").forEach(b => b.onclick = () => { vw = b.dataset.vw; render(); });
  const fe = $("#fo"); if (fe) fe.onchange = e => { fo = e.target.value; render(); };
  const fe2 = $("#ff"); if (fe2) fe2.onchange = e => { ff = e.target.value; render(); };
}

// ── Refresh / live sync ─────────────────────────────────────
async function refresh(force) {
  try {
    const { rows, users } = await loadData();
    const sg = sig(rows, users);
    RAW = rows; USERS = users;
    if (force || sg !== lastSig) { lastSig = sg; buildD(); nav(); render(); }
    sy("Live · TaskFlow ✓ " + new Date().toLocaleTimeString([], { hour: "2-digit", minute: "2-digit" }));
  } catch (e) {
    console.error("Performance dashboard error:", e);
    sy("Offline: TaskFlow se connect nahi hua", 1);
    if (first) $("#m").innerHTML = `<div class="c">Data load nahi ho saka: ${E(e.message || e)}</div>`;
  }
  first = false;
}
const poll = () => { if (!document.hidden) refresh(false); };

// ── Header controls ─────────────────────────────────────────
$("#bs").onchange = e => { basis = e.target.value; if (RAW.length || D.T.length) { buildD(); nav(); render(); } };
$("#rf").onclick = () => refresh(true);
$("#th").onclick = () => {
  const r = document.documentElement;
  const dark = r.dataset.theme ? r.dataset.theme === "dark" : !matchMedia("(prefers-color-scheme: light)").matches;
  r.dataset.theme = dark ? "light" : "dark";
  try { localStorage.setItem("tf_perf_theme", r.dataset.theme); } catch (e) {}
};
$("#lo").onclick = async () => { await supabase.auth.signOut(); window.location.href = "index.html"; };

await refresh(true);
setInterval(poll, 20000);
document.addEventListener("visibilitychange", () => { if (!document.hidden) poll(); });
window.addEventListener("focus", poll);
</script>
</body></html>
