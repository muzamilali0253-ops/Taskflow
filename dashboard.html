<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>TaskFlow – Dashboard</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
<div id="toast"></div>
<div class="app-layout">
  <aside class="sidebar" id="sidebar"></aside>
  <div class="main-content">
    <header class="topbar">
      <button class="hamburger" id="menuToggle">
        <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M4 6h16M4 12h16M4 18h16"/></svg>
      </button>
      <div>
        <div class="topbar-title" id="pageTitle">Dashboard</div>
        <div class="topbar-subtitle" id="pageSubtitle">Overview of your workspace</div>
      </div>
    </header>
    <main class="page-content">
      <!-- Stats -->
      <div class="stats-grid" id="statsGrid">
        <div class="stat-card"><div class="spinner" style="margin:auto"></div></div>
        <div class="stat-card"></div>
        <div class="stat-card"></div>
        <div class="stat-card"></div>
      </div>
      <!-- Two-col: recent activity + my tasks -->
      <div class="two-col">
        <div>
          <div class="card">
            <div class="card-title">Recent Activity</div>
            <div class="card-subtitle">Latest task updates across your workspace</div>
            <div id="activityList"><div class="spinner" style="margin:auto;display:block"></div></div>
          </div>
        </div>
        <div>
          <div class="card">
            <div class="card-title" id="myTasksTitle">My Tasks</div>
            <div class="card-subtitle">Tasks assigned to you</div>
            <div id="myTasksList"></div>
          </div>
        </div>
      </div>

      <!-- Employee Progress Section (Manager & Admin only) -->
      <div id="employeeProgressSection" style="display:none;margin-top:28px">
        <div class="progress-card">
          <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:6px">
            <div class="card-title" style="margin-bottom:0">Employee Task Progress</div>
            <div style="font-size:12px;color:var(--gray-400)">Live overview</div>
          </div>
          <div class="card-subtitle">Individual progress breakdown for each team member</div>
          <!-- Legend -->
          <div class="progress-legend" style="margin-bottom:16px">
            <div class="progress-legend-item"><div class="progress-legend-dot" style="background:var(--warning)"></div> Pending</div>
            <div class="progress-legend-item"><div class="progress-legend-dot" style="background:var(--primary)"></div> In Progress</div>
            <div class="progress-legend-item"><div class="progress-legend-dot" style="background:var(--success)"></div> Completed</div>
          </div>
          <div id="employeeProgressList">
            <div style="text-align:center;padding:24px"><span class="spinner"></span></div>
          </div>
        </div>
      </div>
    </main>
  </div>
</div>

<script type="module">
  import { supabase } from "./supabase.js";
  import { requireAuth, buildSidebar, initMobileMenu, initNotifPopup, statusBadge, formatDate, timeAgo, initials } from "./app.js";

  const user = await requireAuth();
  if (!user) throw new Error("Not authenticated");

  buildSidebar(user, "dashboard.html");
  initMobileMenu();
  initNotifPopup(user);

  document.getElementById("pageTitle").textContent =
    user.role === "admin" ? "System Dashboard" :
    user.role === "manager" ? "Manager Dashboard" : "My Dashboard";

  // Show employee progress for admin and manager
  if (user.role === "admin" || user.role === "manager") {
    document.getElementById("employeeProgressSection").style.display = "";
  }

  // ── Stats ──────────────────────────────────────────────────
  async function loadStats() {
    const grid = document.getElementById("statsGrid");

    const { count: total }     = await supabase.from("tasks").select("id", { count: "exact", head: true });
    const { count: pending }   = await supabase.from("tasks").select("id", { count: "exact", head: true }).eq("status", "pending");
    const { count: progress }  = await supabase.from("tasks").select("id", { count: "exact", head: true }).eq("status", "in_progress");
    const { count: completed } = await supabase.from("tasks").select("id", { count: "exact", head: true }).eq("status", "completed");

    let extra = "";
    if (user.role === "admin") {
      const { count: users } = await supabase.from("users").select("id", { count: "exact", head: true });
      extra = `<div class="stat-card stat-blue">
        <div class="stat-icon"><svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M17 20h5v-2a3 3 0 00-5.356-1.857M17 20H7m10 0v-2c0-.656-.126-1.283-.356-1.857M7 20H2v-2a3 3 0 015.356-1.857M7 20v-2c0-.656.126-1.283.356-1.857m0 0a5.002 5.002 0 019.288 0M15 7a3 3 0 11-6 0 3 3 0 016 0z"/></svg></div>
        <div class="stat-label">Total Users</div>
        <div class="stat-value">${users}</div>
      </div>`;
    }

    grid.innerHTML = `
      <div class="stat-card stat-blue">
        <div class="stat-icon"><svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2M9 5a2 2 0 002 2h2a2 2 0 002-2M9 5a2 2 0 012-2h2a2 2 0 012 2"/></svg></div>
        <div class="stat-label">Total Tasks</div>
        <div class="stat-value">${total}</div>
      </div>
      <div class="stat-card stat-yellow">
        <div class="stat-icon"><svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M12 8v4l3 3m6-3a9 9 0 11-18 0 9 9 0 0118 0z"/></svg></div>
        <div class="stat-label">Pending</div>
        <div class="stat-value">${pending}</div>
      </div>
      <div class="stat-card stat-blue">
        <div class="stat-icon"><svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M13 10V3L4 14h7v7l9-11h-7z"/></svg></div>
        <div class="stat-label">In Progress</div>
        <div class="stat-value">${progress}</div>
      </div>
      <div class="stat-card stat-green">
        <div class="stat-icon"><svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z"/></svg></div>
        <div class="stat-label">Completed</div>
        <div class="stat-value">${completed}</div>
      </div>
      ${extra}
    `;
  }

  // ── Recent activity ────────────────────────────────────────
  async function loadActivity() {
    const { data: tasks } = await supabase
      .from("tasks")
      .select("id, title, status, created_at, assigned_to(name)")
      .order("created_at", { ascending: false })
      .limit(8);

    const el = document.getElementById("activityList");
    if (!tasks || tasks.length === 0) {
      el.innerHTML = `<div class="empty"><p>No activity yet.</p></div>`;
      return;
    }

    el.innerHTML = tasks.map(t => `
      <div class="activity-item">
        <div class="activity-dot">
          <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2M9 5a2 2 0 002 2h2a2 2 0 002-2"/></svg>
        </div>
        <div class="activity-content">
          <div class="activity-title">${t.title}</div>
          <div class="activity-meta">${statusBadge(t.status)} · ${timeAgo(t.created_at)} · assigned to ${t.assigned_to?.name || "—"}</div>
        </div>
      </div>
    `).join("");
  }

  // ── My tasks ───────────────────────────────────────────────
  async function loadMyTasks() {
    let query = supabase.from("tasks").select("id, title, status, deadline").order("created_at", { ascending: false }).limit(5);
    if (user.role === "employee") query = query.eq("assigned_to", user.id);
    else if (user.role === "manager") query = query.eq("assigned_by", user.id);

    const { data: tasks } = await query;
    const el = document.getElementById("myTasksList");

    if (!tasks || tasks.length === 0) {
      el.innerHTML = `<div class="empty"><p>No tasks yet.</p></div>`;
      return;
    }

    el.innerHTML = tasks.map(t => `
      <div style="display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--gray-100)">
        <div style="flex:1;min-width:0">
          <div style="font-size:14px;font-weight:600;color:var(--gray-800);white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${t.title}</div>
          <div style="font-size:11px;color:var(--gray-400);margin-top:2px">${t.deadline ? "Due " + formatDate(t.deadline) : "No deadline"}</div>
        </div>
        ${statusBadge(t.status)}
      </div>
    `).join("") + `<a href="tasks.html" style="display:block;text-align:center;margin-top:14px;font-size:13px;color:var(--primary);font-weight:600;text-decoration:none">View all tasks →</a>`;
  }

  // ── Employee Progress (Manager & Admin) ────────────────────
  async function loadEmployeeProgress() {
    if (user.role === "employee") return;

    // Get all employees
    const { data: employees } = await supabase
      .from("users")
      .select("id, name, role")
      .eq("role", "employee")
      .order("name");

    // Get all tasks with assignment info
    const { data: tasks } = await supabase
      .from("tasks")
      .select("id, status, assigned_to");

    const el = document.getElementById("employeeProgressList");

    if (!employees || employees.length === 0) {
      el.innerHTML = `<div style="text-align:center;padding:20px;color:var(--gray-400);font-size:14px">No employees found.</div>`;
      return;
    }

    // Calculate per-employee stats
    const progressItems = employees.map(emp => {
      const empTasks = tasks?.filter(t => t.assigned_to === emp.id) || [];
      const pendingCount   = empTasks.filter(t => t.status === "pending").length;
      const progressCount  = empTasks.filter(t => t.status === "in_progress").length;
      const completedCount = empTasks.filter(t => t.status === "completed").length;
      const totalCount     = empTasks.length;

      const pendingPct   = totalCount ? Math.round((pendingCount / totalCount) * 100) : 0;
      const progressPct  = totalCount ? Math.round((progressCount / totalCount) * 100) : 0;
      const completedPct = totalCount ? Math.round((completedCount / totalCount) * 100) : 0;

      const completionRate = totalCount ? Math.round((completedCount / totalCount) * 100) : 0;

      return { emp, pendingCount, progressCount, completedCount, totalCount, pendingPct, progressPct, completedPct, completionRate };
    });

    el.innerHTML = progressItems.map(({ emp, pendingCount, progressCount, completedCount, totalCount, pendingPct, progressPct, completedPct, completionRate }) => `
      <div class="employee-progress-item">
        <div class="employee-progress-header">
          <div class="employee-progress-name">
            <div class="employee-avatar">${initials(emp.name)}</div>
            <div>
              <div class="employee-name-text">${emp.name}</div>
              <div class="employee-task-count">${totalCount} task${totalCount !== 1 ? "s" : ""} total · ${completionRate}% complete</div>
            </div>
          </div>
          <div class="progress-stats">
            <span class="progress-stat progress-stat-pending">${pendingCount} Pending</span>
            <span class="progress-stat progress-stat-progress">${progressCount} Active</span>
            <span class="progress-stat progress-stat-completed">${completedCount} Done</span>
          </div>
        </div>
        <div class="progress-bar-container">
          ${totalCount === 0
            ? `<div style="width:100%;height:100%;background:var(--gray-100);border-radius:6px"></div>`
            : `
              ${pendingPct > 0   ? `<div class="progress-bar-segment progress-bar-pending"   style="width:${pendingPct}%"></div>` : ""}
              ${progressPct > 0  ? `<div class="progress-bar-segment progress-bar-progress"  style="width:${progressPct}%"></div>` : ""}
              ${completedPct > 0 ? `<div class="progress-bar-segment progress-bar-completed" style="width:${completedPct}%"></div>` : ""}
            `
          }
        </div>
      </div>
    `).join("");
  }

  await Promise.all([loadStats(), loadActivity(), loadMyTasks(), loadEmployeeProgress()]);
</script>
</body>
</html>
